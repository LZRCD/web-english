name: Windows production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build and activate on Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run smoke:production
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-production-smoke-logs
          path: .wordloop-runtime/*.log
          if-no-files-found: ignore
